include: s2_long.yaml
# D41: TreeGround with tree attention, trained from scratch. One shared recipe; the variant files only set
# ta.variant (flat | full | tree | random_tree). Data: PACO-LVIS train (worklist + ta_paco_nodes cache for the rest
# of the split), Pascal-Part train, gRefCOCO train, per-step shares 0.6 / 0.2 / 0.2 (fixed before any run).
ta:
  variant: tree
  readout_layers: [12, 24, 36]   # heads trained jointly; the layer is chosen with the checkpoint on PACO val
  seed: 0
  steps: 12000
  batch_images: 32              # global batch = world size x micro_batch x accumulation
  micro_batch: 8
  text_only_fraction: 0.2
  gamma: 2.0
  head_lr: 3.0e-4               # heads, learned scale / bias, mask-token embedding
  head_weight_decay: 0.01
  lora_lr: 2.0e-4               # LoRA A/B and the <SEL> row
  lora_weight_decay: 0.0
  warmup_steps: 500
  max_grad_norm: 1.0
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  sources: {paco_train: 0.6, pascal_part_train: 0.2, grefcoco_train: 0.2}
  paco_rest: true               # add the PACO-LVIS train images outside the 10k worklist
  paco_rest_shards: 256
  paco_rest_smoke_images: 16
  eval_every: 1000
  eval_images: 500
  eval_batch: 16
  workers: 6
  log_every: 10
  smoke:
    steps: 20
    micro_batch: 2
    batch_images: 8
    warmup_steps: 2
    eval_every: 10
    eval_images: 10
ta_eval:
  checkpoint: best.pt
  batch_size: 16
