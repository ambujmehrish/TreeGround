<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0306f"/>
    </marker>
    <pattern id="chk" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fff"/><rect width="4" height="4" fill="#e6e6e6"/><rect x="4" y="4" width="4" height="4" fill="#e6e6e6"/>
    </pattern>
    <!-- the scene: a mug on a table -->
    <g id="table"><rect x="0" y="62" width="100" height="38" fill="#c9a77c"/></g>
    <g id="mugbody"><rect x="30" y="22" width="34" height="46" rx="4" fill="#3f78b5"/><ellipse cx="47" cy="22" rx="17" ry="4" fill="#2c5a8c"/></g>
    <g id="handle"><path d="M64,32 C80,32 80,58 64,58" fill="none" stroke="#3f78b5" stroke-width="6"/></g>
    <g id="plant"><rect x="6" y="40" width="14" height="24" fill="#b5653a"/><circle cx="13" cy="34" r="10" fill="#4e9a52"/></g>
  </defs>
  <rect width="1400" height="640" fill="#fff"/>

  <!-- ===== User ===== -->
  <rect x="18" y="14" width="612" height="160" rx="12" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <g transform="translate(34,28) scale(1.3)">
    <rect width="100" height="100" fill="#f3efe6"/>
    <use href="#table"/><use href="#plant"/><use href="#mugbody"/><use href="#handle"/>
  </g>
  <rect x="34" y="28" width="130" height="130" fill="none" stroke="#999" stroke-dasharray="4 3"/>
  <circle cx="205" cy="48" r="16" fill="none" stroke="#444" stroke-width="1.6"/>
  <circle cx="205" cy="44" r="5" fill="none" stroke="#444" stroke-width="1.6"/>
  <path d="M195,58 C198,51 212,51 215,58" fill="none" stroke="#444" stroke-width="1.6"/>
  <text x="230" y="56" font-size="22" font-weight="700">User</text>
  <rect x="190" y="78" width="200" height="74" rx="4" fill="#fff" stroke="#888" stroke-dasharray="4 3"/>
  <text x="290" y="108" font-size="15" text-anchor="middle">“Locate the handle</text>
  <text x="290" y="128" font-size="15" text-anchor="middle">of the mug.”</text>
  <rect x="404" y="78" width="212" height="74" rx="4" fill="#fff" stroke="#888" stroke-dasharray="4 3"/>
  <text x="510" y="100" font-size="13" text-anchor="middle" fill="#555">phrases φ(x):</text>
  <text x="510" y="120" font-size="13.5" text-anchor="middle">“the handle of the mug”</text>
  <text x="510" y="139" font-size="13.5" text-anchor="middle">“the mug”</text>

  <!-- ===== Visual encoder ===== -->
  <path d="M34,158 C34,180 80,180 80,196" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="26" y="198" width="108" height="226" rx="14" fill="#fde3d3" stroke="#e8743b" stroke-width="2.5"/>
  <text x="80" y="292" font-size="17" text-anchor="middle">Qwen3-VL</text>
  <text x="80" y="314" font-size="17" text-anchor="middle">Vision</text>
  <text x="80" y="336" font-size="17" text-anchor="middle">Encoder</text>
  <line x1="80" y1="424" x2="80" y2="478" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ===== SAM 3 grid + text ===== -->
  <line x1="250" y1="174" x2="250" y2="196" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="160" y="198" width="190" height="44" rx="8" fill="#efefef" stroke="#111" stroke-width="2"/>
  <text x="255" y="217" font-size="15" text-anchor="middle" font-weight="600">SAM 3</text>
  <text x="255" y="235" font-size="12" text-anchor="middle">32×32 point grid (query-free)</text>
  <line x1="510" y1="152" x2="510" y2="196" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="404" y="198" width="212" height="44" rx="8" fill="#efefef" stroke="#111" stroke-width="2"/>
  <text x="510" y="217" font-size="15" text-anchor="middle" font-weight="600">SAM 3 text</text>
  <text x="510" y="235" font-size="12" text-anchor="middle">top-3 instances per phrase</text>
  <line x1="255" y1="242" x2="255" y2="262" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="510" y1="242" x2="510" y2="262" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- pool -->
  <rect x="160" y="264" width="456" height="82" rx="10" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="176" y="292" font-size="14" font-weight="600">Query-aware</text>
  <text x="176" y="310" font-size="14" font-weight="600">candidate</text>
  <text x="176" y="328" font-size="14" font-weight="600">mask pool</text>
  <!-- grid thumbnails -->
  <g transform="translate(282,274)">
    <rect width="58" height="58" fill="url(#chk)" stroke="#888"/>
    <g transform="scale(0.58)"><use href="#table"/></g>
  </g>
  <g transform="translate(342,274)">
    <rect width="58" height="58" fill="url(#chk)" stroke="#888"/>
    <g transform="scale(0.58)"><use href="#plant"/></g>
  </g>
  <g transform="translate(402,274)">
    <rect width="58" height="58" fill="url(#chk)" stroke="#888"/>
    <g transform="scale(0.58)"><use href="#mugbody"/></g>
  </g>
  <!-- text-instance thumbnails -->
  <g transform="translate(478,274)">
    <rect width="58" height="58" fill="url(#chk)" stroke="#b0306f" stroke-width="2"/>
    <g transform="scale(0.58)"><use href="#mugbody"/><use href="#handle"/></g>
    <text x="4" y="12" font-size="10" fill="#b0306f" font-weight="700">#1</text>
  </g>
  <g transform="translate(542,274)">
    <rect width="58" height="58" fill="url(#chk)" stroke="#b0306f" stroke-width="2"/>
    <g transform="scale(0.58)"><use href="#handle"/></g>
    <text x="4" y="12" font-size="10" fill="#b0306f" font-weight="700">#1</text>
  </g>
  <line x1="469" y1="270" x2="469" y2="340" stroke="#bbb" stroke-dasharray="3 3"/>
  <text x="370" y="343" font-size="10.5" text-anchor="middle" fill="#666">grid nodes (dedup 0.9, ≤256)</text>
  <text x="537" y="343" font-size="10.5" text-anchor="middle" fill="#b0306f">text instances (dedup 0.95)</text>

  <!-- tree -->
  <line x1="300" y1="346" x2="300" y2="364" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="160" y="366" width="250" height="58" rx="8" fill="#f6f6f6" stroke="#111" stroke-width="1.6"/>
  <text x="176" y="388" font-size="13" font-weight="600">Containment tree</text>
  <text x="176" y="406" font-size="11.5">parent(v): smallest u with</text>
  <text x="176" y="419" font-size="11.5">|m_u ∩ m_v| ≥ 0.8 |m_v|</text>
  <g stroke="#555" stroke-width="1.3">
    <line x1="352" y1="378" x2="334" y2="400"/><line x1="352" y1="378" x2="370" y2="400"/><line x1="370" y1="400" x2="384" y2="416"/>
  </g>
  <circle cx="352" cy="378" r="6" fill="#3f78b5"/><circle cx="334" cy="400" r="6" fill="#999"/>
  <circle cx="370" cy="400" r="6" fill="#3f78b5"/><circle cx="384" cy="416" r="5" fill="#b0306f"/>

  <!-- mask tokenizer -->
  <line x1="410" y1="395" x2="434" y2="395" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M560,346 L560,370" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="436" y="372" width="180" height="52" rx="8" fill="#d5eaf7" stroke="#1f6f9f" stroke-width="2.5"/>
  <text x="526" y="403" font-size="17" text-anchor="middle">Mask Tokenizer</text>
  <line x1="526" y1="424" x2="526" y2="478" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- text tokenizer -->
  <path d="M630,160 L639,160 L639,186 L701,186 L701,196" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="648" y="198" width="106" height="226" rx="10" fill="#efefef" stroke="#111" stroke-width="2"/>
  <text x="701" y="304" font-size="17" text-anchor="middle">Text</text>
  <text x="701" y="326" font-size="17" text-anchor="middle">Tokenizer</text>
  <line x1="701" y1="424" x2="701" y2="478" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ===== bottom token band ===== -->
  <rect x="14" y="482" width="760" height="140" fill="#dde9f5"/>
  <g>
    <rect x="34" y="510" width="20" height="44" rx="3" fill="#f0a27a" stroke="#c4602e"/><rect x="56" y="510" width="20" height="44" rx="3" fill="#f0a27a" stroke="#c4602e"/>
    <text x="90" y="537" font-size="16">…</text>
    <rect x="108" y="510" width="20" height="44" rx="3" fill="#f0a27a" stroke="#c4602e"/><rect x="130" y="510" width="20" height="44" rx="3" fill="#f0a27a" stroke="#c4602e"/>
    <text x="92" y="590" font-size="14" text-anchor="middle">Visual tokens e_j</text>
  </g>
  <g>
    <rect x="250" y="510" width="22" height="44" rx="3" fill="#4aa8dc" stroke="#1f6f9f"/><rect x="276" y="510" width="22" height="44" rx="3" fill="#4aa8dc" stroke="#1f6f9f"/>
    <rect x="302" y="510" width="22" height="44" rx="3" fill="#4aa8dc" stroke="#1f6f9f"/>
    <text x="344" y="537" font-size="16">…</text>
    <rect x="368" y="510" width="22" height="44" rx="3" fill="#4aa8dc" stroke="#b0306f" stroke-width="2"/><rect x="394" y="510" width="22" height="44" rx="3" fill="#4aa8dc" stroke="#b0306f" stroke-width="2"/>
    <text x="334" y="590" font-size="14" text-anchor="middle">Candidate mask tokens x̂_v (one per mask)</text>
  </g>
  <g>
    <rect x="600" y="510" width="20" height="44" rx="3" fill="#8fd18b" stroke="#3d8c39"/><rect x="622" y="510" width="20" height="44" rx="3" fill="#8fd18b" stroke="#3d8c39"/>
    <text x="656" y="537" font-size="16">…</text>
    <rect x="676" y="510" width="20" height="44" rx="3" fill="#8fd18b" stroke="#3d8c39"/>
    <rect x="700" y="510" width="40" height="44" rx="3" fill="#e58ac0" stroke="#b0306f"/>
    <text x="720" y="537" font-size="10.5" text-anchor="middle">&lt;SEL&gt;</text>
    <text x="668" y="590" font-size="14" text-anchor="middle">Query + answer “… &lt;SEL&gt;”</text>
  </g>
  <path d="M780,540 L800,540 L812,552 L800,564 L780,564 z" fill="#fff" stroke="#111" stroke-width="1.6" transform="translate(0,-12)"/>

  <!-- ===== Mask tokenization inset ===== -->
  <rect x="822" y="14" width="260" height="302" fill="#dde9f5"/>
  <text x="952" y="38" font-size="16" text-anchor="middle">Mask Tokenization</text>
  <g transform="translate(838,52)">
    <rect width="54" height="54" fill="url(#chk)" stroke="#888"/>
    <g transform="scale(0.54)"><use href="#handle"/></g>
    <text x="27" y="68" font-size="10.5" text-anchor="middle">mask m_v</text>
  </g>
  <!-- coverage grid -->
  <g transform="translate(920,52)">
    <g stroke="#9ab" stroke-width="0.8" fill="#fff">
      <rect x="0" y="0" width="54" height="54"/>
      <path d="M9,0 V54 M18,0 V54 M27,0 V54 M36,0 V54 M45,0 V54 M0,9 H54 M0,18 H54 M0,27 H54 M0,36 H54 M0,45 H54"/>
    </g>
    <rect x="36" y="18" width="9" height="9" fill="#4aa8dc" opacity="0.9"/><rect x="36" y="27" width="9" height="9" fill="#4aa8dc" opacity="0.5"/>
    <rect x="36" y="36" width="9" height="9" fill="#4aa8dc" opacity="0.9"/><rect x="27" y="18" width="9" height="9" fill="#4aa8dc" opacity="0.3"/>
    <rect x="27" y="36" width="9" height="9" fill="#4aa8dc" opacity="0.3"/>
    <text x="27" y="68" font-size="10.5" text-anchor="middle">coverage c_v</text>
  </g>
  <line x1="894" y1="79" x2="916" y2="79" stroke="#222" stroke-width="1.4" marker-end="url(#ar)"/>
  <!-- three features -->
  <rect x="832" y="136" width="78" height="40" rx="3" fill="#bfe0f2" stroke="#1f6f9f"/>
  <text x="871" y="152" font-size="10.5" text-anchor="middle">pooled p_v</text><text x="871" y="167" font-size="9.5" text-anchor="middle">Σ c·e / Σ c</text>
  <rect x="914" y="136" width="78" height="40" rx="3" fill="#bfe0f2" stroke="#1f6f9f"/>
  <text x="953" y="152" font-size="10.5" text-anchor="middle">geometry g_v</text><text x="953" y="167" font-size="9.5" text-anchor="middle">box, area, depth</text>
  <rect x="996" y="136" width="78" height="40" rx="3" fill="#bfe0f2" stroke="#b0306f"/>
  <text x="1035" y="152" font-size="10.5" text-anchor="middle">provenance q_v</text><text x="1035" y="167" font-size="9.5" text-anchor="middle">text?, rank, score</text>
  <path d="M947,124 L947,129 L871,129 L871,134" fill="none" stroke="#222" stroke-width="1.3" marker-end="url(#ar)"/>
  <g stroke="#222" stroke-width="1.3" fill="none">
    <path d="M871,176 L871,190 L950,190 L950,198" marker-end="url(#ar)"/>
    <path d="M953,176 L953,198" marker-end="url(#ar)"/>
    <path d="M1035,176 L1035,190 L956,190 L956,198" marker-end="url(#ar)"/>
  </g>
  <rect x="892" y="200" width="122" height="34" rx="4" fill="#1f86c6" stroke="#145f8f"/>
  <text x="953" y="222" font-size="13" text-anchor="middle" fill="#fff">MLP + RMS norm</text>
  <line x1="953" y1="234" x2="953" y2="254" stroke="#222" stroke-width="1.3" marker-end="url(#ar)"/>
  <rect x="930" y="256" width="46" height="40" rx="4" fill="#4aa8dc" stroke="#1f6f9f"/>
  <text x="953" y="281" font-size="12" text-anchor="middle">x̂_v</text>
  <text x="952" y="306" font-size="11" text-anchor="middle" fill="#333">mRoPE position = centroid of m_v</text>

  <!-- ===== attention inset ===== -->
  <rect x="1094" y="14" width="292" height="302" fill="#dde9f5"/>
  <text x="1240" y="38" font-size="16" text-anchor="middle">Region-restricted attention</text>
  <g transform="translate(1150,58)">
    <!-- 10x10 matrix: 4 image, 3 text, 3 mask ; rows = queries -->
    <g font-size="10" text-anchor="end"><text x="-6" y="40">image</text><text x="-6" y="100">text</text><text x="-6" y="160">mask</text></g>
    <g font-size="10" text-anchor="middle"><text x="40" y="-4">image</text><text x="105" y="-4">text</text><text x="165" y="-4">mask</text></g>
    <!-- causal image/text block -->
    <path d="M0,0 H20 V20 H40 V40 H60 V60 H80 V80 H100 V100 H120 V120 H0 z" fill="#f0a27a" opacity="0.75"/>
    <path d="M80,80 H100 V100 H120 V120 H80 z" fill="#8fd18b"/>
    <!-- mask rows: text cols all -->
    <rect x="80" y="120" width="60" height="60" fill="#8fd18b"/>
    <!-- mask rows: own region in image cols -->
    <rect x="20" y="120" width="20" height="20" fill="#f0a27a"/><rect x="60" y="140" width="20" height="20" fill="#f0a27a"/>
    <rect x="0" y="160" width="40" height="20" fill="#f0a27a"/>
    <!-- mask-mask with learned tree bias -->
    <rect x="140" y="120" width="60" height="60" fill="#4aa8dc"/>
    <text x="170" y="155" font-size="11" text-anchor="middle" fill="#fff">b[ℓ, rel]</text>
    <!-- text/image never see masks: blank -->
    <g stroke="#89a" stroke-width="0.6" fill="none">
      <rect x="0" y="0" width="200" height="180"/>
      <path d="M20,0 V180 M40,0 V180 M60,0 V180 M80,0 V180 M100,0 V180 M120,0 V180 M140,0 V180 M160,0 V180 M180,0 V180"/>
      <path d="M0,20 H200 M0,40 H200 M0,60 H200 M0,80 H200 M0,100 H200 M0,120 H200 M0,140 H200 M0,160 H200"/>
    </g>
    <g stroke="#111" stroke-width="1.6" fill="none"><path d="M0,80 H200 M0,120 H200 M80,0 V180 M140,0 V180"/></g>
  </g>
  <text x="1104" y="250" font-size="10.5" fill="#333">• mask token: query text + its own region</text>
  <text x="1104" y="264" font-size="10.5" fill="#333">  (mask dilated by 1 cell) + other masks</text>
  <text x="1104" y="278" font-size="10.5" fill="#333">• mask–mask bias per layer ℓ and tree relation</text>
  <text x="1104" y="292" font-size="10.5" fill="#333">  (parent, child, sibling, …)</text>
  <text x="1104" y="306" font-size="10.5" fill="#333">• text and image tokens never see mask tokens</text>

  <!-- ===== LLM ===== -->
  <rect x="822" y="382" width="564" height="70" rx="14" fill="#e3f3dc" stroke="#4d9a3f" stroke-width="2.5"/>
  <text x="1104" y="411" font-size="20" text-anchor="middle">Large Language Model</text>
  <text x="1104" y="433" font-size="14" text-anchor="middle" fill="#333">Qwen3-VL-4B + LoRA (r = 16)</text>

  <!-- input sequence -->
  <rect x="822" y="482" width="564" height="140" fill="#dde9f5"/>
  <rect x="1176" y="482" width="210" height="140" fill="#d8efd2"/>
  <g>
    <rect x="836" y="510" width="16" height="36" rx="3" fill="#f0a27a" stroke="#c4602e"/>
    <text x="862" y="533" font-size="14">…</text>
    <rect x="880" y="510" width="16" height="36" rx="3" fill="#f0a27a" stroke="#c4602e"/>
    <rect x="900" y="510" width="16" height="36" rx="3" fill="#8fd18b" stroke="#3d8c39"/>
    <text x="926" y="533" font-size="14">…</text>
    <rect x="944" y="510" width="16" height="36" rx="3" fill="#8fd18b" stroke="#3d8c39"/>
    <rect x="964" y="510" width="30" height="36" rx="3" fill="#e58ac0" stroke="#b0306f"/>
    <text x="979" y="532" font-size="8.5" text-anchor="middle">SEL</text>
    <rect x="1190" y="510" width="16" height="36" rx="3" fill="#4aa8dc" stroke="#1f6f9f"/>
    <rect x="1210" y="510" width="16" height="36" rx="3" fill="#4aa8dc" stroke="#1f6f9f"/>
    <rect x="1230" y="510" width="16" height="36" rx="3" fill="#4aa8dc" stroke="#1f6f9f"/>
    <text x="1256" y="533" font-size="14">…</text>
    <rect x="1280" y="510" width="16" height="36" rx="3" fill="#4aa8dc" stroke="#b0306f" stroke-width="2"/>
    <rect x="1300" y="510" width="16" height="36" rx="3" fill="#4aa8dc" stroke="#b0306f" stroke-width="2"/>
  </g>
  <g stroke="#999" stroke-width="1.2">
    <line x1="844" y1="508" x2="844" y2="454"/><line x1="888" y1="508" x2="888" y2="454"/><line x1="908" y1="508" x2="908" y2="454"/>
    <line x1="952" y1="508" x2="952" y2="454"/>
  </g>
  <g stroke="#222" stroke-width="1.4">
    <line x1="979" y1="508" x2="979" y2="454"/>
    <line x1="1198" y1="508" x2="1198" y2="454"/><line x1="1218" y1="508" x2="1218" y2="454"/><line x1="1238" y1="508" x2="1238" y2="454"/>
    <line x1="1288" y1="508" x2="1288" y2="454"/><line x1="1308" y1="508" x2="1308" y2="454"/>
  </g>
  <text x="996" y="596" font-size="15" text-anchor="middle">Image + query (causal)</text>
  <text x="1281" y="580" font-size="15" text-anchor="middle">Mask tokens</text>
  <text x="1281" y="600" font-size="15" text-anchor="middle">(appended, one pass)</text>

  <!-- selection head bar -->
  <rect x="822" y="326" width="564" height="40" rx="8" fill="#e3f3dc" stroke="#4d9a3f" stroke-width="2.5"/>
  <text x="840" y="351" font-size="14" font-weight="600">Selection head</text>
  <text x="1150" y="351" font-size="13.5" text-anchor="middle">s_v = λ · cos( f(h_SEL), g(z_v) ) + β ,   v* = argmax_v s_v</text>
  <g stroke="#222" stroke-width="1.6">
    <line x1="979" y1="382" x2="979" y2="369" marker-end="url(#ar)"/>
    <line x1="1240" y1="382" x2="1240" y2="369" marker-end="url(#ar)"/>
  </g>
  <path d="M822,346 L790,346 L790,177" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
  <!-- output column on far right above insets is crowded; put head + output under the user box area -->
  <rect x="648" y="14" width="160" height="160" rx="12" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="728" y="40" font-size="20" text-anchor="middle" font-weight="700">Output</text>
  <g transform="translate(688,52)">
    <rect width="80" height="80" fill="url(#chk)" stroke="#888"/>
    <g transform="scale(0.8)"><use href="#handle"/></g>
  </g>
  
  <text x="728" y="152" font-size="13" text-anchor="middle">mask m_v* (“handle”)</text>
  
  
</svg>
