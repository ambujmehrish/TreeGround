include: [v2.yaml, v4.yaml]
inputs: {manifest: latest, v1: latest, v3: latest, v2: latest, s2: latest}
s2:
  seed: 0
  steps: 2000
  batch_images: 32              # global batch (S1 recipe); = world size x micro_batch x accumulation
  micro_batch: 8
  text_only_fraction: 0.2
  gamma: 2.0
  selector_lr: 3.0e-4
  selector_weight_decay: 0.01
  lora_lr: 2.0e-4               # LoRA A/B and the <SEL> row
  lora_weight_decay: 0.0
  warmup_steps: 100
  max_grad_norm: 1.0
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  eval_every: 250               # checkpoint + PACO val subset evaluation
  eval_images: 500
  eval_batch: 16
  workers: 6
  log_every: 10
  smoke:
    steps: 20
    micro_batch: 2
    batch_images: 8
    warmup_steps: 2
    eval_every: 10
    eval_images: 10
s2_eval:
  checkpoint: best.pt
  batch_size: 16
