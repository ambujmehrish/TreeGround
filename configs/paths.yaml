# All paths are resolved from environment variables; nothing machine-specific is stored here.
tg_root: ${TG_ROOT}
hf_home: ${TG_ROOT}/hf
cache_root: ${TG_CACHE}
runs_root: ${TG_RUNS}

data:
  paco_lvis: ${TG_ROOT}/data/paco/annotations        # paco_lvis_v1_{train,val,test}.json
  coco_images: ${TG_ROOT}/data/coco                  # train2017/ val2017/ train2014/
  grefcoco: ${TG_ROOT}/data/grefcoco                 # grefs(unc).json, instances.json
  partonomy: ${TG_ROOT}/data/partonomy-core          # test-qa_pairs.json, images/
  sceneparser: ${TG_ROOT}/data/sceneparser           # train.jsonl, val.jsonl
  sceneparser_images: ${TG_ROOT}/data/egoobjects     # contains datasets/EgoObjects/images/

models:
  qwen: {repo: Qwen/Qwen3-VL-4B-Instruct, revision: ebb281ec70b05090aa6165b016eac8ec08e71b17}
  sam3: {repo: facebook/sam3, revision: 3c879f39826c281e95690f02c7821c4de09afae7}
  siglip: {repo: google/siglip2-so400m-patch14-384, revision: e8e487298228002f3d8a82e0cd5c8ea9c567f57f}

slurm:
  account: ${TG_SLURM_ACCOUNT}
  partition: boost_usr_prod
  qos: normal
  time: "04:00:00"
  cpus_per_task: 8
  mem: 120G
