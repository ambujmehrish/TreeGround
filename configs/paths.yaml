# All paths are resolved from environment variables; nothing machine-specific is stored here.
tg_root: ${TG_ROOT}
hf_home: ${TG_ROOT}/hf
cache_root: ${TG_CACHE}
runs_root: ${TG_RUNS}

data:
  paco_lvis: ${TG_DATA}/paco/annotations        # paco_lvis_v1_{train,val,test}.json
  coco_images: ${TG_DATA}/coco                  # train2017/ val2017/ train2014/
  grefcoco: ${TG_DATA}/grefcoco                 # grefs(unc).json, instances.json
  partonomy: ${TG_DATA}/partonomy-core          # test-qa_pairs.json, images/
  sceneparser: ${TG_DATA}/sceneparser           # train.jsonl, val.jsonl
  sceneparser_images: ${TG_DATA}/egoobjects     # contains datasets/EgoObjects/images/
  pascal_part_ann: ${TG_DATA}/pascal_part/Annotations_Part      # Pascal-Part .mat files (trainval.tar.gz)
  pascal_voc: ${TG_DATA}/pascal_part/VOCdevkit/VOC2010          # JPEGImages/, ImageSets/Main/val.txt
  ade20k_parquet: ${TG_DATA}/ade20k/data/validation-00000-of-00001.parquet  # HF mirror 1aurent/ADE20K
  lvis_val_json: ${TG_DATA}/lvis/lvis_v1_val.json                           # images from coco_images/{train,val}2017
  openimages_boxes: ${TG_DATA}/openimages/validation-annotations-bbox.csv
  openimages_classes: ${TG_DATA}/openimages/oidv7-class-descriptions-boxable.csv
  openimages_images: ${TG_DATA}/openimages/validation                       # <ImageID>.jpg

models:
  qwen: {repo: Qwen/Qwen3-VL-4B-Instruct, revision: ebb281ec70b05090aa6165b016eac8ec08e71b17}
  sam3: {repo: facebook/sam3, revision: 3c879f39826c281e95690f02c7821c4de09afae7}
  siglip: {repo: google/siglip2-so400m-patch14-384, revision: e8e487298228002f3d8a82e0cd5c8ea9c567f57f}

slurm:
  account: ${TG_SLURM_ACCOUNT}
  partition: boost_usr_prod
  qos: ""                # empty: partition default QOS
  time: "04:00:00"
  cpus_per_task: 8
  mem: 120G
